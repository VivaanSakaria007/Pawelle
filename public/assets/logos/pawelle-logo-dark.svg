<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%" fill="none">
  <!-- Brand Emblem: Botanical Leaf & Paw Silhouette (Dark Variant) -->
  <g transform="translate(10, 10)">
    <!-- Decorative botanical wreath curve -->
    <path d="M 30,5 C 10,15 5,42 22,54 C 28,58 35,59 40,56 C 36,48 36,30 46,20 C 42,12 37,7 30,5 Z" fill="#8FBFA7" opacity="0.95" />
    <path d="M 32,7 C 24,18 25,36 34,46" stroke="#D9CDBC" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Stylized central paw pad in warm terracotta -->
    <path d="M 28 35 C 24 35 22 39 23 43 C 24 47 28 49 32 49 C 36 49 40 47 41 43 C 42 39 40 35 36 35 C 34 33 30 33 28 35 Z" fill="#D9826C" />
    
    <!-- Toe pads -->
    <ellipse cx="23" cy="27" rx="3.2" ry="4.5" transform="rotate(-20 23 27)" fill="#8FBFA7" />
    <ellipse cx="30" cy="23" rx="3.3" ry="4.8" fill="#8FBFA7" />
    <ellipse cx="37" cy="24" rx="3.3" ry="4.8" transform="rotate(15 37 24)" fill="#8FBFA7" />
    <ellipse cx="43" cy="29" rx="3.0" ry="4.2" transform="rotate(30 43 29)" fill="#8FBFA7" />
    
    <!-- Subtle sparkle/accent star -->
    <path d="M 50,14 Q 50,18 54,18 Q 50,18 50,22 Q 50,18 46,18 Q 50,18 50,14 Z" fill="#D9CDBC" />
  </g>

  <!-- Typography: PAWELLE in Warm Luminous Ivory -->
  <text x="76" y="44" font-family="'Fraunces', Georgia, serif" font-size="28" font-weight="600" letter-spacing="2.5" fill="#F7F4EC">
    PAWELLE
  </text>

  <!-- Subtitle: LUXURY GROOMING & SPA in Terracotta Accent -->
  <text x="78" y="59" font-family="'DM Sans', -apple-system, sans-serif" font-size="8.5" font-weight="500" letter-spacing="3.2" fill="#D9826C">
    PET GROOMING &amp; SPA
  </text>
</svg>
